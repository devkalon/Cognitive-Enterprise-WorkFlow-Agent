[project]
name = "cewa-openenv"
version = "1.0.0"
description = "Cognitive Enterprise Workflow Agent - OpenEnv"
authors = [{ name = "devKalon" }]

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "openenv-core>=0.2.0"
]

[project.scripts]
server = "server.app:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"